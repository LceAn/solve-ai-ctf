name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile all sources
        run: python -m compileall -q .

      - name: Docs hygiene (conflict markers / hard-coded test counts)
        run: |
          if grep -rnE "^(<<<<<<< |>>>>>>> |=======$)" --include='*.md' .; then
            echo "::error::发现未解决的合并冲突标记"; exit 1
          fi
          if grep -rnE "[0-9]+ ?项断言" README.md; then
            echo "::error::README 不得硬编码测试断言数量（以运行输出为准）"; exit 1
          fi

      - name: Core self test
        run: python scripts/self_test.py

      - name: Workbench end-to-end test
        run: python workbench/test_workbench.py
